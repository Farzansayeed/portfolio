<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Farzan Sayeed Hashmi</title>
  <meta name="description" content="This page doesn't exist. But there is still a way out.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0a08">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="404.css">
</head>
<body>
  <main class="shell">
    <header class="head">
      <p class="code" aria-hidden="true">404</p>
      <h1>Page not found.</h1>
      <p class="lede">But there is still a way out.</p>
    </header>

    <section class="game" aria-label="Arrow Escape — help every arrow leave the board">
      <div class="hud">
        <span class="hud-item" id="level">Level 01</span>
        <span class="hud-item hud-status" id="status" aria-live="polite"></span>
        <span class="hud-item hearts" id="hearts" aria-label="Hearts remaining">
          <span class="heart" aria-hidden="true"></span>
          <span class="heart" aria-hidden="true"></span>
          <span class="heart" aria-hidden="true"></span>
        </span>
        <span class="hud-item">Moves: <b id="moves">0</b></span>
      </div>

      <div class="board-frame">
        <svg id="board" class="board" role="group" aria-label="Puzzle board"></svg>
        <canvas id="fx" aria-hidden="true"></canvas>

        <div id="overlay" class="overlay" hidden>
          <p class="overlay-kicker" id="overlay-kicker"></p>
          <p class="overlay-title" id="overlay-title"></p>
          <p class="overlay-sub" id="overlay-sub"></p>
          <div class="overlay-actions">
            <button id="overlay-primary" class="btn btn-solid" type="button"></button>
            <a id="overlay-home" class="btn btn-ghost" href="/">← Home</a>
          </div>
        </div>
      </div>

      <div class="controls">
        <button id="hint" class="btn btn-ghost" type="button">Hint</button>
        <button id="restart" class="btn btn-ghost" type="button" title="Shortcut: R">Restart</button>
        <a class="btn btn-ghost home-btn" href="/">← Home</a>
      </div>
    </section>

    <p class="hint-note">Tap an arrow with a clear path to the edge · Blocked taps cost a heart · Hint highlights a valid move · R restarts</p>
  </main>
  <script src="404.js" defer></script>
</body>
</html>
